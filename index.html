<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json?v=4">
  <title>LED Banner</title>

  <!-- Google Fonts: Selección de fuentes chulas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Press+Start+2P&family=Silkscreen:wght@700&family=Tilt+Neon&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ff2a2a;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Pantalla del Banner (Texto Liso Original) */
    #banner-screen {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      background-color: #000;
    }

    #marquee-text {
      font-weight: 700;
      line-height: 1;
      padding-left: 100vw;
      display: inline-block;
      will-change: transform;
      z-index: 1;
      text-shadow: 0 0 12px currentColor;
    }

    /* Tipografías Disponibles */
    .font-sans {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0px;
    }
    .font-led {
      font-family: 'Silkscreen', monospace;
      letter-spacing: 2px;
    }
    .font-neon {
      font-family: 'Tilt Neon', cursive;
      letter-spacing: 4px;
    }
    .font-retro {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: -2px;
    }
    .font-digital {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
    }

    /* Ajustes de Tamaño por Orientación */
    @media (orientation: landscape) {
      #marquee-text.font-sans { font-size: 85vh; }
      #marquee-text.font-led { font-size: 70vh; }
      #marquee-text.font-neon { font-size: 85vh; }
      #marquee-text.font-retro { font-size: 60vh; }
      #marquee-text.font-digital { font-size: 75vh; }
    }

    @media (orientation: portrait) {
      #marquee-text.font-sans { font-size: 45vh; }
      #marquee-text.font-led { font-size: 35vh; }
      #marquee-text.font-neon { font-size: 45vh; }
      #marquee-text.font-retro { font-size: 30vh; }
      #marquee-text.font-digital { font-size: 40vh; }
    }

    /* Panel de Configuración */
    #config-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 14, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 16px;
      padding: 24px 16px;
      z-index: 10;
      overflow-y: auto;
    }

    .input-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: 1px solid #333;
      background-color: #1c1c1e;
      color: #fff;
      outline: none;
    }

    .save-btn {
      padding: 0 16px;
      background: #2c2c2e;
      color: #ffcc00;
      border: 1px solid #444;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Controles de Colores */
    .color-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }
    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    /* Selector de Fuentes (Horizontal scroll) */
    .font-picker-container {
      width: 100%;
      max-width: 480px;
    }
    .font-picker-label {
      font-size: 0.8rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .font-picker {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .font-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: #8e8e93;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
    .font-btn.active {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
    }

    /* Favoritos */
    .favorites-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 100px;
    }
    .favorites-header {
      font-size: 0.8rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      padding-left: 4px;
    }
    .favorites-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .fav-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 10px;
    }
    .delete-fav {
      color: #ff453a;
      font-size: 1.2rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    button.play-btn {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
      background-color: #30d158;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(48, 209, 88, 0.3);
    }
  </style>
</head>
<body>

  <!-- Pantalla Principal del Banner -->
  <div id="banner-screen" onclick="toggleConfig()">
    <div id="marquee-text" class="font-sans">Toca para configurar</div>
  </div>

  <!-- Panel de Control -->
  <div id="config-panel">
    <div class="input-container">
      <input type="text" id="text-input" placeholder="Escribe tu mensaje..." value="¡Hola mundo!">
      <button class="save-btn" onclick="saveCurrentFavorite()" title="Guardar en favoritos">★</button>
    </div>
    
    <!-- Colores -->
    <div class="color-picker">
      <div class="color-btn active" style="background: #ff2a2a;" onclick="setColor('#ff2a2a', this)"></div>
      <div class="color-btn" style="background: #ff9500;" onclick="setColor('#ff9500', this)"></div>
      <div class="color-btn" style="background: #00ff66;" onclick="setColor('#00ff66', this)"></div>
      <div class="color-btn" style="background: #00e5ff;" onclick="setColor('#00e5ff', this)"></div>
      <div class="color-btn" style="background: #ffff00;" onclick="setColor('#ffff00', this)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
    </div>

    <!-- Fuentes -->
    <div class="font-picker-container">
      <div class="font-picker-label">Estilo de Fuente</div>
      <div class="font-picker">
        <button class="font-btn active" id="btn-sans" onclick="setFont('sans', this)">Liso (Original)</button>
        <button class="font-btn" id="btn-led" onclick="setFont('led', this)">LED Matriz</button>
        <button class="font-btn" id="btn-neon" onclick="setFont('neon', this)">Neón</button>
        <button class="font-btn" id="btn-retro" onclick="setFont('retro', this)">Retro 8-Bit</button>
        <button class="font-btn" id="btn-digital" onclick="setFont('digital', this)">Digital</button>
      </div>
    </div>

    <!-- Favoritos -->
    <div class="favorites-section">
      <div class="favorites-header">Frases Guardadas</div>
      <div class="favorites-list" id="favorites-list"></div>
    </div>

    <button class="play-btn" onclick="startBanner()">MOSTRAR BANNER</button>
  </div>

  <script>
    let animationId = null;
    let posX = 0;
    // Velocidad de scroll incrementada
    const speed = 9.5; 

    const bannerScreen = document.getElementById('banner-screen');
    const textElement = document.getElementById('marquee-text');
    const configPanel = document.getElementById('config-panel');
    const textInput = document.getElementById('text-input');
    const favoritesList = document.getElementById('favorites-list');

    let currentColor = '#ff2a2a';
    let currentFontClass = 'font-sans';
    let favorites = JSON.parse(localStorage.getItem('led_banner_favs') || '[]');

    function init() {
      renderFavorites();
    }

    function setColor(color, element) {
      currentColor = color;
      textElement.style.color = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');
    }

    function setFont(fontType, element) {
      textElement.classList.remove('font-sans', 'font-led', 'font-neon', 'font-retro', 'font-digital');
      currentFontClass = 'font-' + fontType;
      textElement.classList.add(currentFontClass);

      document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');
    }

    function animate() {
      posX -= speed;
      const textWidth = textElement.offsetWidth;
      
      if (posX < -textWidth) {
        posX = window.innerWidth;
      }
      
      textElement.style.transform = `translateX(${posX}px)`;
      animationId = requestAnimationFrame(animate);
    }

    function startBanner() {
      const val = textInput.value.trim();
      textElement.textContent = val !== "" ? val : "S.O.S";
      configPanel.style.display = 'none';
      
      cancelAnimationFrame(animationId);
      posX = window.innerWidth;
      animate();
    }

    function toggleConfig() {
      if (configPanel.style.display === 'none') {
        configPanel.style.display = 'flex';
        cancelAnimationFrame(animationId);
      } else {
        startBanner();
      }
    }

    function saveCurrentFavorite() {
      const text = textInput.value.trim();
      if (!text) return;
      
      if (!favorites.includes(text)) {
        favorites.unshift(text);
        localStorage.setItem('led_banner_favs', JSON.stringify(favorites));
        renderFavorites();
      }
    }

    function loadFavorite(text) {
      textInput.value = text;
      startBanner();
    }

    function deleteFavorite(event, index) {
      event.stopPropagation();
      favorites.splice(index, 1);
      localStorage.setItem('led_banner_favs', JSON.stringify(favorites));
      renderFavorites();
    }

    function renderFavorites() {
      favoritesList.innerHTML = '';
      if (favorites.length === 0) {
        favoritesList.innerHTML = '<div style="color:#666; font-size:0.9rem; text-align:center; padding:12px;">Sin frases guardadas. Usa la ★ para añadir.</div>';
        return;
      }

      favorites.forEach((fav, index) => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.onclick = () => loadFavorite(fav);

        const textSpan = document.createElement('span');
        textSpan.className = 'fav-text';
        textSpan.textContent = fav;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-fav';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteFavorite(e, index);

        item.appendChild(textSpan);
        item.appendChild(delBtn);
        favoritesList.appendChild(item);
      });
    }

    window.addEventListener('resize', () => {
      if (configPanel.style.display === 'none') {
        posX = window.innerWidth;
      }
    });

    init();
  </script>
</body>
</html>
