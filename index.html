<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>LED Banner</title>

  <!-- Fuente tipo Matriz LED / Digital -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ff2a2a; /* Rojo Neón LED */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    /* Clases de Tipografía */
    .font-sans {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-led {
      font-family: 'VT323', monospace;
      letter-spacing: 4px !important;
    }

    /* Pantalla del Banner */
    #banner-screen {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
    }
    #marquee-text {
      font-weight: 900;
      line-height: 1;
      letter-spacing: 2px;
      padding-left: 100vw;
      display: inline-block;
      will-change: transform;
      text-shadow: 0 0 20px currentColor;
    }

    /* En orientación apaisada (Landscape) */
    @media (orientation: landscape) {
      #marquee-text {
        font-size: 88vh;
      }
    }

    /* En orientación vertical (Portrait) */
    @media (orientation: portrait) {
      #marquee-text {
        font-size: 50vh;
      }
    }

    /* Panel de Configuración */
    #config-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 14, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 16px;
      padding: 24px 16px;
      z-index: 10;
      overflow-y: auto;
    }

    .input-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      font-size: 1.1rem;
      border-radius: 12px;
      border: 1px solid #333;
      background-color: #1c1c1e;
      color: #fff;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #007aff;
    }

    .save-btn {
      padding: 0 16px;
      background: #2c2c2e;
      color: #ffcc00;
      border: 1px solid #444;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Selector de Colores y Fuente */
    .controls-row {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .color-picker {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .font-picker {
      display: flex;
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 3px;
    }
    .font-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #8e8e93;
      cursor: pointer;
      font-weight: 600;
    }
    .font-btn.active {
      background: #2c2c2e;
      color: #fff;
    }

    /* Sección de Frases Favoritas */
    .favorites-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 120px;
    }
    .favorites-header {
      font-size: 0.85rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      padding-left: 4px;
    }
    .favorites-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .fav-item:active {
      background: #2c2c2e;
    }
    .fav-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 10px;
    }
    .delete-fav {
      color: #ff453a;
      font-size: 1.2rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    button.play-btn {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
      background-color: #30d158;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(48, 209, 88, 0.3);
    }
  </style>
</head>
<body>

  <!-- Pantalla del Letrero -->
  <div id="banner-screen" onclick="toggleConfig()">
    <div id="marquee-text" class="font-sans">Toca para configurar</div>
  </div>

  <!-- Panel de Control -->
  <div id="config-panel">
    <div class="input-container">
      <input type="text" id="text-input" placeholder="Escribe tu mensaje..." value="¡Hola mundo!">
      <button class="save-btn" onclick="saveCurrentFavorite()" title="Guardar en favoritos">★</button>
    </div>
    
    <div class="controls-row">
      <div class="color-picker">
        <div class="color-btn active" style="background: #ff2a2a;" onclick="setColor('#ff2a2a', this)"></div>
        <div class="color-btn" style="background: #00ff66;" onclick="setColor('#00ff66', this)"></div>
        <div class="color-btn" style="background: #00e5ff;" onclick="setColor('#00e5ff', this)"></div>
        <div class="color-btn" style="background: #ffff00;" onclick="setColor('#ffff00', this)"></div>
        <div class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
      </div>

      <div class="font-picker">
        <button class="font-btn active" id="btn-font-sans" onclick="setFont('sans')">Normal</button>
        <button class="font-btn" id="btn-font-led" onclick="setFont('led')">LED</button>
      </div>
    </div>

    <!-- Lista de Favoritos -->
    <div class="favorites-section">
      <div class="favorites-header">Frases Guardadas</div>
      <div class="favorites-list" id="favorites-list">
        <!-- Se rellena dinámicamente -->
      </div>
    </div>

    <button class="play-btn" onclick="startBanner()">MOSTRAR BANNER</button>
  </div>

  <script>
    let animationId = null;
    let posX = 0;
    // Velocidad incrementada un 30%
    const speed = 5.2; 

    const bannerScreen = document.getElementById('banner-screen');
    const textElement = document.getElementById('marquee-text');
    const configPanel = document.getElementById('config-panel');
    const textInput = document.getElementById('text-input');
    const favoritesList = document.getElementById('favorites-list');

    let currentColor = '#ff2a2a';
    let currentFont = 'sans';
    let favorites = JSON.parse(localStorage.getItem('led_banner_favs') || '[]');

    function init() {
      renderFavorites();
    }

    function setColor(color, element) {
      currentColor = color;
      textElement.style.color = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');
    }

    function setFont(fontType) {
      currentFont = fontType;
      if (fontType === 'led') {
        textElement.classList.remove('font-sans');
        textElement.classList.add('font-led');
        document.getElementById('btn-font-led').classList.add('active');
        document.getElementById('btn-font-sans').classList.remove('active');
      } else {
        textElement.classList.remove('font-led');
        textElement.classList.add('font-sans');
        document.getElementById('btn-font-sans').classList.add('active');
        document.getElementById('btn-font-led').classList.remove('active');
      }
    }

    function animate() {
      posX -= speed;
      const textWidth = textElement.offsetWidth;
      
      if (posX < -textWidth) {
        posX = window.innerWidth;
      }
      
      textElement.style.transform = `translateX(${posX}px)`;
      animationId = requestAnimationFrame(animate);
    }

    function startBanner() {
      const val = textInput.value.trim();
      textElement.textContent = val !== "" ? val : "S.O.S";
      configPanel.style.display = 'none';
      
      cancelAnimationFrame(animationId);
      posX = window.innerWidth;
      animate();
    }

    function toggleConfig() {
      if (configPanel.style.display === 'none') {
        configPanel.style.display = 'flex';
        cancelAnimationFrame(animationId);
      } else {
        startBanner();
      }
    }

    // --- Gestión de Favoritos (LocalStorage) ---

    function saveCurrentFavorite() {
      const text = textInput.value.trim();
      if (!text) return;
      
      if (!favorites.includes(text)) {
        favorites.unshift(text);
        localStorage.setItem('led_banner_favs', JSON.stringify(favorites));
        renderFavorites();
      }
    }

    function loadFavorite(text) {
      textInput.value = text;
      startBanner();
    }

    function deleteFavorite(event, index) {
      event.stopPropagation();
      favorites.splice(index, 1);
      localStorage.setItem('led_banner_favs', JSON.stringify(favorites));
      renderFavorites();
    }

    function renderFavorites() {
      favoritesList.innerHTML = '';
      if (favorites.length === 0) {
        favoritesList.innerHTML = '<div style="color:#666; font-size:0.9rem; text-align:center; padding:12px;">Sin frases guardadas. Usa la ★ para añadir.</div>';
        return;
      }

      favorites.forEach((fav, index) => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.onclick = () => loadFavorite(fav);

        const textSpan = document.createElement('span');
        textSpan.className = 'fav-text';
        textSpan.textContent = fav;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-fav';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteFavorite(e, index);

        item.appendChild(textSpan);
        item.appendChild(delBtn);
        favoritesList.appendChild(item);
      });
    }

    window.addEventListener('resize', () => {
      if (configPanel.style.display === 'none') {
        posX = window.innerWidth;
      }
    });

    init();
  </script>
</body>
</html>
